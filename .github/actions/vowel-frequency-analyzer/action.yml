name: 'Vowel Frequency Analyzer'
description: 'Custom action to analyze vowel frequency in a given file.'


inputs:
  file:
    description: 'The path to the text file to be analyzed'
    required: true


runs:
  using: 'docker'
  image: 'ghcr.io/kdandy1/vowel-frequency-analyzer:latest'
  entrypoint: ['/bin/bash', '/.github/scripts/entrypoint.sh']
  env:
    FILE: ${{ inputs.file }}