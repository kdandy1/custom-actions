name: 'Vowel Frequency Analyzer'
description: 'Anvalyze the frequency of vowels in a given text file'


inputs:
  file:
    description: 'The path to the text file to be analyzed'
    required: true


runs:
  using: 'composite'
  steps:
    - name: Checkout Repository
      uses: actions/checkout@v7


    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Run Vowel Frequency Analyzer
      shell: bash
      run: |
        python3 .github/scripts/frequency.py ${{ inputs.file }}

    - name: Update README with Vowel Frequency
      shell: bash
      run: |
        bash .github/scripts/update_readme.sh